<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#142024" />
    <title>Quimia Arcade</title>

      #oops { display: none; position: fixed; inset: 0; z-index: 10; background: #142024;

      #oops small { font: 400 24px 'PT Sans', sans-serif; color: #5ADFEA; }

    <div id="game"></div>
    <div id="hud"></div>
